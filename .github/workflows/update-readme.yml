name: Update README

on:
  push:
    branches: [ main ]
  schedule:
    # Actualizar automáticamente cada día a las 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permitir ejecución manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    name: Update this repo's README with recent activity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📊 Update README with basic stats
        run: |
          echo "📊 Updating README with basic GitHub stats..."
          
          # Obtener información básica del usuario
          USER_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                          https://api.github.com/user)
          
          # Obtener repositorios públicos
          REPOS_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                           https://api.github.com/user/repos?visibility=public)
          
          # Contar repositorios
          REPO_COUNT=$(echo "$REPOS_DATA" | jq length 2>/dev/null || echo "0")
          
          # Obtener fecha actual
          CURRENT_DATE=$(date +'%d/%m/%Y %H:%M UTC')
          
          echo "✅ Found $REPO_COUNT public repositories"
          echo "📅 Last updated: $CURRENT_DATE"

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Updated README with latest stats - $(date +'%Y-%m-%d')"
          git push || echo "⚠️ Nothing to push"