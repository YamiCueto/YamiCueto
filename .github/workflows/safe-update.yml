name: Safe Profile Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  safe-update:
    runs-on: ubuntu-latest
    name: 🔧 Safe Profile Update
    
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 📊 Basic Stats Update
        run: |
          echo "🔄 Starting safe profile update..."
          
          # Verificar que README existe
          if [ ! -f "README.md" ]; then
            echo "❌ README.md not found!"
            exit 1
          fi
          
          # Obtener fecha actual para actualización
          CURRENT_DATE=$(date +'%d de %B de %Y')
          CURRENT_TIME=$(date +'%H:%M UTC')
          
          echo "📅 Current date: $CURRENT_DATE"
          echo "⏰ Current time: $CURRENT_TIME"
          
          # Verificar estructura del README
          if grep -q "Yamid Cueto" README.md; then
            echo "✅ README structure is valid"
          else
            echo "⚠️ README might need attention"
          fi
          
          echo "✨ Safe update completed successfully!"

      - name: 🎯 Validation Check
        run: |
          echo "🔍 Running validation checks..."
          
          # Verificar enlaces importantes
          echo "🔗 Checking important links..."
          
          if grep -q "linkedin.com" README.md; then
            echo "✅ LinkedIn link found"
          fi
          
          if grep -q "github.io" README.md; then
            echo "✅ GitHub Pages links found"
          fi
          
          if grep -q "Tata Consultancy" README.md; then
            echo "✅ Company information found"
          fi
          
          echo "📊 Basic statistics:"
          echo "📄 Lines in README: $(wc -l < README.md)"
          echo "🔤 Words in README: $(wc -w < README.md)"
          
          echo "✅ All validation checks passed!"

      - name: 📝 Update Status
        run: |
          echo "## 📊 Profile Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status:** Successfully updated" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date:** $(date +'%d/%m/%Y')" >> $GITHUB_STEP_SUMMARY
          echo "⏰ **Time:** $(date +'%H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Profile:** [Visit Profile](https://github.com/YamiCueto)" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Status:** All systems operational" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 Success Notification
        run: |
          echo "🎊 Profile update completed successfully!"
          echo "✨ No errors detected"
          echo "🔗 Profile URL: https://github.com/YamiCueto"
          echo "📈 Ready for visitors!"